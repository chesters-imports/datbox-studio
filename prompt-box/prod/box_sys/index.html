<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>promptBOX</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="/datbox-core/css/desk_dialog.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-chrome" data-deck-chrome>
        <span class="chip" data-deck-menu title="Menu">prompt<strong>BOX</strong></span>
        <span class="chrome-meta" id="chrome-meta" data-deck-drag
          >DATBOX Studio - no deck loaded</span
        >
        <div class="deck-win" data-deck-window-controls aria-label="Window"></div>
      </header>

      <div class="work">
        <div class="rail-column">
          <div class="rail-slim" id="rail-slim" hidden>
            <button type="button" class="rail-tab" id="btn-rail-open" title="Open safe box">&raquo;</button>
          </div>
          <aside class="region rail" id="safe-rail" aria-label="Safe box">
            <div class="region-head">
              <span>Prompt decks</span>
              <div class="head-actions">
                <button type="button" class="btn linkish density-toggle" id="btn-safe-density" title="Density" aria-pressed="false">
                  <svg class="density-ico density-ico-comfy" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true">
                    <rect x="1.5" y="1.75" width="9" height="1.5" rx="0.4" fill="currentColor"/>
                    <rect x="1.5" y="5.25" width="9" height="1.5" rx="0.4" fill="currentColor" opacity="0.45"/>
                    <rect x="1.5" y="8.75" width="9" height="1.5" rx="0.4" fill="currentColor"/>
                  </svg>
                  <svg class="density-ico density-ico-compact" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" hidden>
                    <rect x="1.5" y="1.25" width="9" height="1" rx="0.3" fill="currentColor"/>
                    <rect x="1.5" y="3.5" width="9" height="1" rx="0.3" fill="currentColor" opacity="0.55"/>
                    <rect x="1.5" y="5.75" width="9" height="1" rx="0.3" fill="currentColor"/>
                    <rect x="1.5" y="8" width="9" height="1" rx="0.3" fill="currentColor" opacity="0.55"/>
                    <rect x="1.5" y="10.25" width="9" height="1" rx="0.3" fill="currentColor"/>
                  </svg>
                </button>
                <button type="button" class="btn linkish rail-close" id="btn-rail-close" title="Collapse">&laquo;</button>
              </div>
            </div>
            <div class="region-body" id="box-list"></div>
            <div class="region-foot dock dock-4" role="toolbar">
              <button type="button" class="btn dock-btn" id="btn-new-box" title="New deck">+</button>
              <button type="button" class="btn dock-btn" id="btn-new-folder" title="New folder">F</button>
              <button type="button" class="btn dock-btn" id="btn-rename-folder" title="Rename folder" disabled>S</button>
              <button type="button" class="btn dock-btn danger" id="btn-del-folder" title="Delete folder" disabled>X</button>
            </div>
          </aside>
        </div>

        <div class="main" id="main-pane">
          <div id="main-empty" class="main-empty">
            <p class="empty-hint">
              Open a prompt deck in the rail,<br />
              or create one.
            </p>
            <button type="button" class="btn cta-new" id="btn-new-box-empty">New deck</button>
          </div>

          <div id="main-loaded" class="main-loaded" hidden>
            <div class="context-strip">
              <div class="meta-display">
                <span class="meta-k">Deck</span>
                <span class="meta-v" id="meta-box-name">-</span>
              </div>
              <div class="meta-display">
                <span class="meta-k">Stem</span>
                <span class="meta-v mono" id="meta-stem">-</span>
              </div>
              <div class="deck-actions">
                <button type="button" class="btn" id="btn-rename-deck">Rename deck...</button>
                <button type="button" class="btn danger" id="btn-delete-deck">Delete deck...</button>
              </div>
            </div>

            <div class="main-split">
              <section class="region cards" aria-label="Prompts">
                <div class="region-head">
                  <span>Prompts</span>
                  <button type="button" class="btn btn-icon" id="btn-new-card" title="New prompt">+</button>
                </div>
                <div class="region-body card-list" id="card-list"></div>
              </section>

              <section class="region editor-region" aria-label="Editor">
                <div class="region-head">
                  <span>Prompt card</span>
                  <div class="head-actions">
                    <button type="button" class="btn btn-save-pop" id="btn-save" disabled>Save</button>
                    <button type="button" class="btn btn-icon danger" id="btn-del-card" title="Delete prompt" disabled>X</button>
                  </div>
                </div>
                <div class="region-body">
                  <div id="editor-empty" class="empty-hint">
                    Pick a prompt or mint a new one.
                  </div>
                  <div id="editor" class="editor" hidden>
                    <div class="card-id-meta">
                      <div class="card-id-cell">
                        <span class="meta-k">Code</span>
                        <span class="meta-v mono" id="f-code">-</span>
                      </div>
                      <div class="card-id-cell" id="f-tps-line" hidden>
                        <span class="meta-k">TPS chip</span>
                        <span class="meta-v mono" id="f-tps">-</span>
                      </div>
                    </div>
                    <div class="field">
                      <span>Prompt</span>
                      <textarea id="f-prompt" rows="4" placeholder="The question or prompt..."></textarea>
                    </div>
                    <div class="field">
                      <span>Notes <span class="muted">(optional)</span></span>
                      <textarea id="f-notes" rows="5" placeholder="Extra context, follow-ups, notes..."></textarea>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>

      <footer class="status" id="status">HTML ok - loading scripts...</footer>
    </div>

    <script>
      window.__promptUseLoader = true;
      (function () {
        var statusEl = document.getElementById("status");
        function st(msg, err) {
          if (!statusEl) return;
          statusEl.textContent = msg;
          statusEl.className = err ? "status err" : "status";
        }
        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();
            s.async = false;
            s.onload = function () {
              st("Loaded " + src.split("?")[0].split("/").pop());
              resolve(src);
            };
            s.onerror = function () {
              st("FAILED to load script: " + src, true);
              reject(new Error("load failed: " + src));
            };
            document.body.appendChild(s);
          });
        }
        st("1/3 desk_dialog...");
        loadScript("/datbox-core/js/desk_dialog.js")
          .catch(function () {
            st("desk_dialog skip - using native prompts");
            return null;
          })
          .then(function () {
            st("2/3 theme.js...");
            return loadScript("theme.js");
          })
          .then(function () {
            st("3/3 app.js...");
            return loadScript("app.js");
          })
          .then(function () {
            if (typeof window.__promptBoot === "function") {
              st("Starting boot...");
              return window.__promptBoot();
            }
            st("app.js loaded but __promptBoot missing", true);
          })
          .catch(function (e) {
            st("Script chain failed: " + (e && e.message ? e.message : e), true);
          });
      })();
    </script>
  </body>
</html>
